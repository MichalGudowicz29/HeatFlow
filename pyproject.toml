[project]
name = "heatflow"
version = "2.1.0"
description = "HeatFlow – wielokryterialne mapy preferencji przestrzennych na danych GIS (OSM + własne dane, MCDA)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0",
    "requests>=2.31",
    "pymcdm>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
importer = [
    "osmium>=4.3.2",
]

[project.scripts]
heatflow = "heatflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heatflow"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "heatflow/web"
"data/catalog.json" = "heatflow/data/catalog.json"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# fonttools 4.69.0 (zależność matplotlib ← pymcdm) ma tylko wheel dla CPython 3.11
constraint-dependencies = ["fonttools!=4.69.0"]
